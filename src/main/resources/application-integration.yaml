spring:
  config:
    activate:
      on-profile: integration
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3307/report_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${DB_USERNAME:report_user}
    password: ${DB_PASSWORD:report_pass}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8092}

eureka:
  client:
    enabled: true
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

app:
  gateway:
    public-url: /
    auth-header-mapping-enabled: true
  kafka:
    enabled: ${KAFKA_ENABLED:false}
  outbox:
    relay-enabled: ${OUTBOX_RELAY_ENABLED:false}
  comment-service:
    base-url: ${COMMENT_SERVICE_BASE_URL:http://localhost:8090}
    report-context-path: /internal/comments/{commentUuid}/report-context
